<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tannnzxc Store | Detailed Tech Specs</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --glass-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-blue: #38bdf8;
        }

        body {
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 28px;
        }

        .product-img-box {
            background: rgba(15, 23, 42, 0.5);
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .price-badge {
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent-blue);
            border: 1px solid rgba(56, 189, 248, 0.3);
            font-weight: 700;
            padding: 6px 16px;
            border-radius: 10px;
            display: inline-block;
            font-size: 1.25rem;
        }

        .spec-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .spec-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 12px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .spec-icon {
            color: var(--accent-blue);
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .spec-label {
            color: #94a3b8;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: block;
        }

        .spec-value {
            font-size: 0.85rem;
            font-weight: 500;
            display: block;
        }

        .student-tag {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-blue);
            font-weight: 700;
        }
    </style>
</head>
<body>

    <nav class="navbar pt-5">
        <div class="container justify-content-center">
            <span class="navbar-brand text-white fw-bold d-flex align-items-center m-0">
                <i class="bi bi-cpu-fill me-2 text-info"></i>
                TANNNZXC <span class="text-info ms-1">STORE</span>
            </span>
        </div>
    </nav>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6 col-xl-5">
                
                <div class="glass-card p-4 shadow-lg">
                    <div class="product-img-box mb-4 text-center">
                        <img src="https://cdn.dxomark.com/wp-content/uploads/medias/post-155689/Apple-iPhone-15-Pro-Max_-blue-titanium_featured-image-packshot-review-1024x691.jpg" 
                             class="img-fluid p-3" alt="iPhone 15 Pro Max" style="max-height: 200px;">
                    </div>

                    <div class="text-center mb-4">
                        <div class="student-tag mb-1">Flagship Performance</div>
                        <h1 class="h3 fw-bold mb-2">iPhone 15 Pro Max</h1>
                        <div class="price-badge">₱64,799.46</div>
                    </div>

                    <hr class="my-4" style="border-color: rgba(255,255,255,0.1);">

                    <div class="spec-grid">
                        <div class="spec-item">
                            <i class="bi bi-cpu spec-icon"></i>
                            <span class="spec-label">Processor</span>
                            <span class="spec-value">A17 Pro Chip</span>
                        </div>
                        <div class="spec-item">
                            <i class="bi bi-display spec-icon"></i>
                            <span class="spec-label">Display</span>
                            <span class="spec-value">6.7" ProMotion</span>
                        </div>
                        <div class="spec-item">
                            <i class="bi bi-camera spec-icon"></i>
                            <span class="spec-label">Main Camera</span>
                            <span class="spec-value">48MP Triple</span>
                        </div>
                        <div class="spec-item">
                            <i class="bi bi-memory spec-icon"></i>
                            <span class="spec-label">Memory</span>
                            <span class="spec-value">8GB RAM</span>
                        </div>
                        <div class="spec-item">
                            <i class="bi bi-battery-charging spec-icon"></i>
                            <span class="spec-label">Battery</span>
                            <span class="spec-value">4441 mAh</span>
                        </div>
                        <div class="spec-item">
                            <i class="bi bi-gpu-card spec-icon"></i>
                            <span class="spec-label">Graphics</span>
                            <span class="spec-value">6-Core GPU</span>
                        </div>
                        <div class="spec-item">
                            <div class="bi bi-wifi spec-icon"></div>
                            <span class="spec-label">Connectivity</span>
                            <span class="spec-value">5G / Wi-Fi 6E</span>
                        </div>
                        <div class="spec-item">
                            <div class="bi bi-water spec-icon"></div>
                            <span class="spec-label">Durability</span>
                            <span class="spec-value">IP68 Rated</span>
                        </div>
                    </div>

                </div>

            </div>
        </div>
    </main>

    <footer class="text-center py-5">
        <p class="text-secondary small">© 2026 Tannnzxc Store | Advanced Tech Hub</p>
    </footer>

    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
